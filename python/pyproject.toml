[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "spanlog"
version = "0.0.0"
description = "Readable call-boundary logs: one line when a call starts, one when it ends."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build==1.6.1",
  "fastapi==0.162.0",
  "flask==3.1.3",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "waitress==3.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spanlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
