[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "spanlog"
version = "0.1.0"
description = "Readable call-boundary logs: one line when a call starts, one when it ends."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "chaugiakhang193" }]
keywords = ["logging", "asgi", "wsgi", "sqlalchemy", "fastapi", "flask", "request-id"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chaugiakhang193/spanlog"
Documentation = "https://github.com/chaugiakhang193/spanlog/blob/main/docs/python.md"
Changelog = "https://github.com/chaugiakhang193/spanlog/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/chaugiakhang193/spanlog/issues"

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0,<3"]
dev = [
  "asyncpg==0.32.0",
  "build==1.6.1",
  "fastapi==0.162.0",
  "flask==3.1.3",
  "greenlet==3.5.6",
  "mypy==2.4.1",
  "psycopg[binary]==3.3.6",
  "pytest==9.2.0",
  "ruff==0.17.3",
  "sqlalchemy==2.1.6",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "waitress==3.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spanlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not pg'"
markers = ["pg: needs the Postgres of compose.yaml, run with -m pg"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
