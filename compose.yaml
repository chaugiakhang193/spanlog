name: spanlog

# Database for the integration tests of the database adapters and for
# examples/express-orders and examples/fastapi-orders. The data lives in memory and is gone when the
# container stops. The credentials only open this local test database.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: spanlog
      POSTGRES_PASSWORD: spanlog
      POSTGRES_DB: spanlog
    ports:
      - "127.0.0.1:5438:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spanlog -d spanlog"]
      interval: 2s
      timeout: 3s
      retries: 15
